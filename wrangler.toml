name = "geolightsurvey"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Static site. Files matching a request are served by the platform before the
# Worker runs, so pages, CSS, fonts and images never cost an invocation.
# Unmatched paths fall through to src/index.js.
[assets]
directory = "./public"
not_found_handling = "none"

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
# must be on the routing-enabled domain
NOTIFY_FROM = "noreply@geolightsurvey.com"
NOTIFY_TO = "geolightsurvey@gmail.com"

# Free, but only to this verified destination. notify.js omits `to` so the
# binding uses it — the endpoint cannot be made to mail anyone else.
# Supported on Workers; NOT supported on Pages, which is why we moved.
[[send_email]]
name = "EMAIL"
destination_address = "geolightsurvey@gmail.com"

# Uncomment in Block F, once `wrangler d1 create` returns the real id.
 [[d1_databases]]
 binding = "DB"
 database_name = "geolightsurvey"
 database_id = "3bf63be2-9480-46a8-a900-d2954ceda896"

[triggers]
crons = ["30 3 * * SUN"]

# TURNSTILE_SECRET is NOT here. Set it with:
#   wrangler secret put TURNSTILE_SECRET
